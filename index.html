<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="./coi-serviceworker.js"></script>
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    </head>

    <body>
        <nav class="navbar">
            <a href="index.html" class="active">NACA Visualization</a>
            <a href="simulations.html">Simulations</a>
        </nav>

        <div class="workspace">
            <div class="terminal">
                <div class="mac-header">
                    <div class="mac-buttons">
                        <span class="mac-dot close"></span>
                        <span class="mac-dot minimize"></span>
                        <span class="mac-dot maximize"></span>
                    </div>
                    <div class="mac-title">📁 varvarak — -zsh — 80×24</div>
                </div>
                <div class="mac-body">
                    <script type="py" src="./terminal_prompts.py" terminal worker></script>
                </div>
            </div>

            <div id="plotter-section" style="display: none;">
                <div class="controls">
                    <div class="row">
                        <label for="t-slider">Thickness: <span id="t-val">0.12</span></label>
                        <input type="range" id="t-slider" min="0.01" max="0.5" step="0.01" value="0.12">
                    </div>

                    <div class="row">
                        <label for="m-slider">Max Camber: <span id="m-val">0.02</span></label>
                        <input type="range" id="m-slider" min="0.00" max="0.09" step="0.005" value="0.02">
                    </div>

                    <div class="row">
                        <label for="p-slider">Camber Position: <span id="p-val">0.4</span></label>
                        <input type="range" id="p-slider" min="0.1" max="0.9" step="0.05" value="0.4">
                    </div>
                    <button id="reset-btn" type="button">Reset</button>
                    <div id="plot-area"></div>
                </div>
            </div>
        </div>

        <script type="py" src="./airfoil.py" config="./pyscript.json"></script>
    </body>
</html>
